<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Marca · Memória de Trabalho</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <main class="wrap">
    <header class="page-head">
      <p class="kicker">Identidade visual</p>
      <h1>Marca</h1>
      <p>O logo principal é o pente de RAM. Os outros três ficam como versões para materiais específicos.</p>
    </header>

    <section class="logo-grid">
      <figure class="logo-card principal">
        <object data="assets/logos/memoria-de-trabalho.svg" type="image/svg+xml" aria-label="Logo principal"></object>
        <figcaption>
          <b>Principal · Pente de RAM</b>
          A caixa é um módulo de memória, com chanfro e contatos: o trocadilho com <i>working memory</i>.
          <ul>
            <li>Topo do site, documentos e apresentações</li>
            <li>Assinatura no começo e no fim dos vídeos</li>
            <li>Marca d'água nos cortes para redes</li>
          </ul>
        </figcaption>
      </figure>
    </section>

    <section>
      <p class="kicker">Alternativos</p>
      <h2>Para outros materiais</h2>
      <div class="logo-grid">
        <figure class="logo-card">
          <object data="assets/logos/alternativos/lambe-lambe.svg" type="image/svg+xml" aria-label="Lambe-lambe"></object>
          <figcaption>
            <b>Lambe-lambe</b>
            <ul>
              <li>Capa do podcast nas plataformas: <a href="assets/capa/capa-podcast-3000.png">PNG 3000×3000</a> · <a href="assets/capa/capa-podcast-3000.jpg">JPG</a></li>
              <li>Cartazes e lambes de rua, posts quadrados</li>
            </ul>
          </figcaption>
        </figure>
        <figure class="logo-card">
          <object data="assets/logos/alternativos/carimbo.svg" type="image/svg+xml" aria-label="Carimbo"></object>
          <figcaption>
            <b>Carimbo</b>
            <ul>
              <li>Adesivos e selos sobre fotos e prints</li>
              <li>Miniaturas de episódio e anúncios de convidados</li>
            </ul>
          </figcaption>
        </figure>
        <figure class="logo-card">
          <object data="assets/logos/alternativos/estencil.svg" type="image/svg+xml" aria-label="Estêncil"></object>
          <figcaption>
            <b>Estêncil</b>
            <ul>
              <li>Banner do canal no YouTube e capas de perfil</li>
              <li>Faixas, camisetas e materiais de ato</li>
            </ul>
          </figcaption>
        </figure>
      </div>
    </section>

    <p class="back"><a href="./">← voltar ao site</a></p>
  </main>
</body>
</html>
