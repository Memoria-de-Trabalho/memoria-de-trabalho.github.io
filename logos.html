<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Opções de logo · Memória de Trabalho</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <main class="wrap">
    <header class="page-head">
      <p class="kicker">Rascunho para votação</p>
      <h1>Opções de logo</h1>
      <p>Cinco caminhos, todos com lettering dentro de uma caixa: carimbo, lambe-lambe, estêncil, pente de RAM e selo de sindicato.</p>
    </header>

    <section class="logo-grid">
      <figure class="logo-card">
        <object data="assets/logos/01-carimbo.svg" type="image/svg+xml" aria-label="Opção 1"></object>
        <figcaption><b>01 · Carimbo</b> Tinta vermelha, borda dupla, levemente torto. Vale para cabeçalho do site e assinatura de vídeo.</figcaption>
      </figure>
      <figure class="logo-card">
        <object data="assets/logos/02-lambe-lambe.svg" type="image/svg+xml" aria-label="Opção 2"></object>
        <figcaption><b>02 · Lambe-lambe</b> Tipo de madeira sobre amarelo, como cartaz colado em poste. Quadrado, então já serve de capa do podcast.</figcaption>
      </figure>
      <figure class="logo-card">
        <object data="assets/logos/03-estencil.svg" type="image/svg+xml" aria-label="Opção 3"></object>
        <figcaption><b>03 · Estêncil</b> Letra vazada em papel sobre caixa vermelha, estilo faixa de manifestação.</figcaption>
      </figure>
      <figure class="logo-card">
        <object data="assets/logos/04-pente-de-ram.svg" type="image/svg+xml" aria-label="Opção 4"></object>
        <figcaption><b>04 · Pente de RAM</b> A caixa é um módulo de memória, com chanfro e contatos. O trocadilho com <i>working memory</i>, e o “DDR-1917”.</figcaption>
      </figure>
      <figure class="logo-card">
        <object data="assets/logos/05-selo.svg" type="image/svg+xml" aria-label="Opção 5"></object>
        <figcaption><b>05 · Selo</b> Carimbo redondo de sindicato com a sigla MdT. Bom para avatar de redes sociais.</figcaption>
      </figure>
    </section>

    <p class="back"><a href="./">← voltar ao site</a></p>
  </main>
</body>
</html>
